name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg
      - run: pip install pytest shellcheck-py
      - run: python -m pytest -q tests
      - run: shellcheck -S warning deploy/install.sh deploy/catcam-update deploy/catcam-insights lounge/apply.sh
